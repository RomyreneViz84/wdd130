<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Have questions or need assistance? Get in touch with our team today. Send us a message, call, or visit our office.">
    <meta name="author" content="ROMY VIZCARRA">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - RAPID PULSE RAFTING</title>
</head>
<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="logo">
        <nav>
            <ul class="icons">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
             </ul>
        </nav>
    </header>
    <main>
        <div class="information">
            <h1>RAPID PULSE RAFTING</h1>
            <p>127B San Francisco Street</p>
            <p>Reference: Next to Oso Cafe</p>
            <p>Cercado Arequipa</p>
            <p>+1 999999999</p>
            <p>info@rapidpulserafting.com.pe</p>
        </div>
        <section class="map-form">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2184.142519278165!2d-71.5374633618338!3d-16.398484348707246!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2spe!4v1785338063946!5m2!1ses!2spe" 
                        width="600" 
                        height="450" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
            <div>
                <form>
                    <div class="form-group align-center">
                        <label for="fullname">Name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group align-center">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                    <!-- 1. Purpose of Message (Radio Buttons) -->
                    <div class="form-group align-top">
                        <label class="form-label">Message Purpose:</label>
                        <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" id="option1" name="Purpose" value="general_inquiry" required checked>
                            <span>General Inquiry</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" id="option2" name="Purpose" value="reservation_question">
                            <span>Reservation Question</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" id="option3" name="Purpose" value="website_suggestion">
                            <span>Website Suggestion</span>
                        </label>
                        </div>
                    </div>
                    <!-- 2. Message Textarea -->
                    <div class="Form-group stackerd">
                        <label for="message" class="form-label">Message:</label>
                        <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
                    </div>
                    <!-- 3. Newsletter Checkbox -->
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                        <input type="checkbox" id="newsletter_subscribe" name="newsletter_subscribe" value="yes">
                        <span>Please subscribe me to the monthly newsletter</span>
                        </label>
                    </div>
                    <!-- 4. Submit Button -->
                    <button type="submit" class="btn-submit">Send Message Touch Here</button>
                </form>
            </div>
            
        </section>
        <section class="adventure1">
            <h2>We Are Here To Serve You!</h2>
            <div class="adventure-content1">
            <figure>
                <img src="images/supervisor.jpg" alt="supervisor">
                <figcaption>Supervisor</figcaption>
            </figure>
            <figure>
                <img src="images/manager.jpg" alt="manager">
                <figcaption>Manager</figcaption>
            </figure>
            <figure>
                <img src="images/field-leader.jpg" alt="field-lider">
                <figcaption>Field Lider</figcaption>
            </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©️2026 💦 RAPID PULSE RAFTING 💦 Romy Vizcarra</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.svg" alt="Facebook Icon" class="social-icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.svg" alt="LinkedIn Icon" class="social-icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.svg" alt="Instagram Icon" class="social-icon">
                </a>
            </nav>
        
    </footer>
</body>
</html>
